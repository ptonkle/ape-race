name: Build and deploy to Pages

# A push to main builds the game and deploys it. The checks run locally
# before the push (scripts/timed-checks.sh quick, or check.sh for a map
# merge), not here: the person, 2026-10-15, "let's check locally instead",
# so a deploy takes minutes, not a full check on a 4-core runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen CLI (pinned, as crates/shim/Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127

      - name: Build (scripts/build.sh)
        run: ./scripts/build.sh

      # What scripts/pages.sh did for the site folder: drop the transport
      # test page and add the patch notes as a plain page. The Test times
      # page reads committed notes (check-times.md, test-dashboard.json), no cargo.
      - name: Assemble the site
        run: |
          rm -f dist/nettest.html dist/nettest.js
          python3 scripts/patch_notes_html.py dist/patch-notes.html
          python3 scripts/tests_page.py dist/tests.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
