"test:map_pictures" = ["menus"]

# ---------------------------------------------------------------------------
# Browser check steps (tests/browser/interactions.py STEPS) -> tags. The
# page load, the boot step and the closing checks (no page error, no
# off-origin request...) always run when the browser check runs at all.
# The browser check runs when any tag below (or `page`) is hit; `page` runs
# every step.
[browser]
boot = ["page", "render"]
settings = ["menus", "sound"]
race = ["menus", "race", "items", "physics", "ai", "render", "models", "gear", "replay", "camera", "maps-jungle"]
secret = ["menus", "render"]
time_trial = ["race", "menus", "items", "maps-jungle"]
replays_list = ["replay", "menus"]
whats_new = ["notes", "menus"]
city_map = ["menus", "maps-city", "maps-ski", "maps-jungle", "render", "scenery"]
weather = ["weather", "maps-ski", "menus", "render", "sky", "scenery"]
setup_layout = ["menus", "costumes", "weather"]
random_map = ["menus", "race", "maps-city", "maps-jungle", "maps-sector", "maps-ruins", "maps-bay", "maps-tower"]

# Online check steps (scripts/check-online.sh) -> tags. They run only on
# these tags (or `all`), never for `page` alone.
[online]
transport = ["online"]
race = ["online"]
