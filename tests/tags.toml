# Test tags (the person, 2026-10-15: "classify each of the unit tests and
# then each of the sets of changes with the same set of tags and only run
# tests if the feature change set included at least one change with the same
# tag").
#
# scripts/quick-check.sh reads this file: changed files -> tags (through
# [sources]), then runs only the tests whose tags meet those (through
# [tests], [browser] and [online]). scripts/check.sh still runs everything.
# scripts/tags.py guard (run by check.sh) fails when a test, a browser step, an
# online step or a tracked file is not classified here.
#
# A test carries every tag whose change could break it, not only its topic:
# a test that races AI apes on the City is ai, physics, race, items and
# maps-city. When unsure, add the tag: an extra tag only costs time.

[tags]
all = "foundations (fixed point, vectors, the core's door, the shim, the build): run everything"
physics = "ape bodies, vines, collisions: ape.rs, vinesim.rs, the rules' numbers"
ai = "the AI drivers and their difficulty levels"
race = "a race's flow: countdown, places, finishes, Time Trial, medals, Floor is Lava, hype, the dance"
items = "item crates, thrown things, summoned vines, boosts"
menus = "screens, settings, Race Setup, the HUD and speedometer, strings"
notes = "What's New: the patch notes and their screen"
camera = "the race camera, focus, spectating, the lobby camera"
render = "the drawing's core: mesh.rs, render.rs, scene.rs, shaders, gl.js. Hitting it hits models, gear, sky and scenery too ([implies])"
models = "ape and animal meshes and poses (models.rs, the jaguars, the dance)"
gear = "outfit meshes: each map's gear and the costumes' clothes (tourist, wizard, explorer, pirate, space, ski)"
sky = "sky, light, fog and each look's colours (sky.rs)"
hud = "the race HUD: place, time, best, minimap, flashes, the speedometer"
setup = "the Race Setup and Time Trial setup screens"
settings = "the Settings screen and the title's secret"
results = "the pause menu, the results, the medal table"
hype = "the hype meter and its calls"
trial = "Time Trial's rules and targets"
medals = "each map's medal times (app/medals.rs)"
lava = "Floor is Lava: the jaguar's timings and eating"
vines = "the drawn vines' bending (vinesim.rs: drawing only, no race reads it)"
icon = "the tab icon"
dock = "the menus' dock beside the previewed ape and its camera"
gallery = "the model gallery (a viewer for pictures)"
tiles = "the home page's tiles (?tile=)"
scenery = "a map's drawn scenery and props (*scape.rs, *models.rs of a map); its maps-* tag carries it too"
sound = "the synthesiser and its cues"
replay = "replays, ghosts, saved runs"
online = "online play: lobby, protocol, transport"
costumes = "palettes and unlockable costumes"
weather = "the Settings weather and each map's weather"
page = "the web page (web/), its browser checks"
boundary = "the core's purity scanner, dependency allowlist and CSP (always run: it scans every file)"
maps-jungle = "the Jungle course (course.rs)"
maps-city = "the City"
maps-ski = "the Ski Slope (Yeti Peak)"
maps-sector = "Sector Ape (space)"
maps-ruins = "Sunset Ruins"
maps-bay = "Banana Bay Battle"
maps-tower = "Mape's Tower (the wizard tower)"
maps-ravine = "Rattlesnake Ravine (the slot canyon)"
# a map's art: its scenery and model files. Carried by that map's drawing,
# scene and scenery tests, not its AI, physics or course tests (a mesh
# change cannot move a racer). Narrow: it runs a map's test on its own.
art-city = "the City's scenery and vehicles (cityscape.rs, vehicles.rs)"
art-ski = "the Ski Slope's scenery (skiscape.rs; vehicles.rs's snowcats)"
art-sector = "Sector Ape's scenery and craft (sectorscape.rs, spacecraft.rs's drawing)"
art-ruins = "Sunset Ruins' scenery and models (ruinsscape.rs, ruinsmodels.rs)"
art-bay = "Banana Bay Battle's scenery and ships (bayscape/, baymodels.rs)"
art-tower = "Mape's Tower's scenery and models (towerscape/, towermodels/)"
art-ravine = "Rattlesnake Ravine's art alone (its sky and light: ravinescape's own files)"

# A hit tag on the left also hits the tags on the right: a change to the
# drawing's core can break any drawn thing.
[implies]
render = ["models", "gear", "sky", "scenery", "vines"]

# Tags whose tests always run in a quick check.
[always]
tags = ["boundary"]

