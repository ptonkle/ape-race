# ---------------------------------------------------------------------------
# A changed file whose diff touches only lines matching these patterns (Python
# regular expressions over the whole line) takes these tags instead of its
# [sources] tags. Every deploy bumps VERSION in app.rs; on its own that is a
# patch-notes change, not a change to the nine features app.rs carries. Any
# other changed line in the file keeps its [sources] tags.
[lines]
"crates/core/src/app.rs" = { patterns = ['^pub const VERSION: &str = "[^"]*";$'], tags = ["notes"] }

# ---------------------------------------------------------------------------
# Function -> tags, for a big file whose functions belong to different
# features: per file, Python regular expressions over the name of the
# outermost `fn` (or `def`) holding a changed line (its doc comments and
# attributes count as part of it). Every matching regex adds its tags; a
# changed line in no named function, or in one no regex names, takes the
# file's [sources] tags. Outside any fn, a struct or enum holding the line,
# or a one-line `const`/`static` it declares, is named the same way.
[functions]

# A map's art feeds its logic in a few named places: those keep the map's
# tag (and the weather looks keep weather). Everything else in an art file
# is drawing (art-<map>, scenery).
[functions."crates/core/src/spacecraft.rs"]
'^(pose|tumble|halves|wreck_halves|clamp_gap|wreck_passage|joint|mech_pose|mech_frame|mech_anchors|mech_anchor|Passage|MechKind|Gait|Mech|MechAnchors|MechPose|RECESS|WRECK_GAP|MECH_HEIGHT|BREAK|PASSAGE_Z|HULL_W|HULL_H|MOTHERSHIP_LENGTH)$' = ["maps-sector", "art-sector", "scenery"]

[functions."crates/core/src/sectorscape.rs"]
'^(flash_of|FLASH_TICKS)$' = ["maps-sector", "art-sector", "race"]
'^route_lines$' = ["art-sector", "hud"]

[functions."crates/core/src/skiscape.rs"]
'^crowns$' = ["maps-ski", "art-ski", "camera"]

[functions."crates/core/src/bayscape.rs"]
'^squall$' = ["art-bay", "weather", "sky"]

[functions."crates/core/src/towerscape.rs"]
'^(twilight|dawn)$' = ["art-tower", "weather", "sky"]

[functions."crates/core/src/towerscape/art.rs"]
'^casters$' = ["maps-tower", "art-tower", "scenery"]

[functions."crates/core/src/towermodels/portal.rs"]
'^portal_clear$' = ["maps-tower", "art-tower", "scenery"]

[functions."crates/core/src/towermodels/towers.rs"]
'^(TOWER2_RADIUS|V1_KEEP_RADIUS)$' = ["maps-tower", "art-tower", "scenery"]

# the jaguar's timings and Eaten::new are race rules; its pose is only drawn
[functions."crates/core/src/jaguar.rs"]
'^(jaguar|size|whole|gait|fwd)$' = ["models"]
'^(new|ago|feet)$' = ["lava"]

[functions."crates/core/src/app/menus.rs"]
'^(settings_act|settings_panels|title_click)$' = ["settings"]

[functions."crates/core/src/app/results.rs"]
'^race_panels$' = ["results", "online", "replay", "trial", "medals", "camera"]
'^best_row$' = ["results", "race", "replay"]
'^results_table$' = ["results", "camera"]
'^medal_table$' = ["results", "medals", "trial"]
'^results_due$' = ["results", "lava", "camera"]

[functions."crates/core/src/app/items.rs"]
'^hype_tick$' = ["hype"]
'^(item_toggles|tick_item)$' = ["items", "setup"]

[functions."crates/core/src/app/setup.rs"]
'^lava_toggle$' = ["setup", "lava"]

# the dance: `dancing` frames the spectate camera; the rest is the pose
# (spectate's dance-watching test carries models, so a change to `of`'s
# weight still runs it)
[functions."crates/core/src/dance.rs"]
'^dancing$' = ["camera", "models"]

# app/race.rs: starting a race, showing it, its tick. Only `step_race`, the
# race's tick, reaches every concern; a line outside the five fns is a `use`
[functions."crates/core/src/app/race.rs"]
'^start_race$' = ["race", "setup", "items", "replay", "trial", "lava", "costumes"]
'^begin$' = ["race", "camera", "ai", "replay"]
'^step_race$' = ["race", "items", "replay", "costumes", "camera", "sound"]
'^follow_speed$' = ["hud", "hype", "settings"]
'^step_chains$' = ["vines", "items"]

[functions."crates/core/src/app/view.rs"]
'^(resize|aspect)$' = ["render", "camera"]
'^(scene_version|scenery|static_scene)$' = ["render", "menus"]
'^frame$' = ["render", "weather", "replay", "camera", "lava"]
'^ghost_draws$' = ["replay", "render"]

# app.rs keeps the hub: `new`, `act`, `tick`, `ui`, `go`, `key` and the
# structs take the file's tags; these belong to one domain
[functions."crates/core/src/app.rs"]
'^(best|best_mut)$' = ["race", "trial", "medals", "replay"]
'^(t|map_name)$' = ["menus"]
'^(decimal|ordinal|clock_text)$' = ["hud", "results", "menus"]
'^(mouse_move|pointer_lock|blur)$' = ["camera", "race"]
'^(held|controls|mouse_button)$' = ["race", "camera", "items"]
'^quick_restart$' = ["race", "replay", "results"]
'^escape$' = ["race", "results", "menus", "replay"]
'^(GRAB_BUTTON|DOUBLE_TAP|MAX_CATCH_UP|TICK_COST)$' = ["race"]
'^CALL_KEY$' = ["sound"]
'^(KEEP_AFTER_FINISH|KEEP_AGAIN)$' = ["replay"]
'^(SPECTATE_AFTER|DANCE_SHOWN|FINISH_WATCH_MOST|EATEN_SPECTATE_AFTER)$' = ["camera", "results", "lava"]
'^TITLE_CLICKS$' = ["settings"]

# models.rs: the outfits are gear; the rest (bodies, poses, the dance moves,
# which outfit a map wears) stays models
[functions."crates/core/src/models.rs"]
'^(gear_colours|ski_frames|board|skis|helmet|metal_side|eye_spot|metal_arm|jacket_cut|jacket|shades|safari_hem|safari_jacket|pith_helmet|spectacles|pirate_kit|pirate|tricorn|bandana|eyepatch|hoop|garment|sleeves|captains_coat|striped_shirt|loose_shirt|waistcoat|sash|bandolier|cutlass|parrot|hook|peg_leg|navy_coat|bicorne|bubble_helmet)$' = ["gear"]

# A changed line inside `def step_<name>` of these files runs browser step
# <name> alone (it must be a step in [browser]); any other line keeps the
# file's [sources] tags. The regex's group 1 is the step.
[steps]
"tests/browser/interactions.py" = '^step_(\w+)$'

# Test files run their own tests, not every test of their topic: a changed
# crates/core/tests/<file>.rs runs test:<file>; a changed *tests.rs under
# crates/core/src runs its module's tests; a changed line inside a
# `#[cfg(test)] mod` runs the test it sits in (or that module's tests, for a
# helper). Their [sources] tags apply only when no such test exists.

# ---------------------------------------------------------------------------
# Cargo tests -> tags. A key is `<target>:<name prefix>`: `lib:` for the
# core's own tests by module path, `test:<file>` for an integration test file
# (crates/core/tests/<file>.rs), optionally with `:<name prefix>`. The
# longest matching key wins, so a mixed module can be split by test name.
[tests]
"lib:ape::" = ["physics"]
"lib:ape::ski_tests::" = ["physics", "maps-ski"]
"lib:ai::tests::on_the_tower_" = ["ai", "maps-tower"]
"lib:ai::tests::on_rattlesnake_ravine_" = ["ai", "maps-ravine"]
"lib:ai::tests::on_rattlesnake_ravine_a_grounded_ape" = ["maps-ravine"]
"lib:api::" = ["page", "menus"]
# app.rs's tests, moved to one file per domain (tags3, 2026-10-17)
"lib:app::race_tests::" = ["race", "setup", "menus"]
"lib:app::race_tests::a_summoned_vine_adds_a_chain" = ["items", "physics", "render", "vines", "race"]
"lib:app::race_tests::the_chosen_ai_difficulty" = ["ai", "menus", "race"]
"lib:app::race_tests::escape_pauses" = ["race", "results", "menus", "setup"]
"lib:app::race_tests::r_twice_quickly" = ["race", "results", "menus", "setup", "replay"]
"lib:app::sound_tests::" = ["sound", "menus"]
"lib:app::settings_tests::" = ["render", "models", "menus", "settings"]
"lib:app::settings_tests::settings_round_trip" = ["menus", "setup", "settings", "costumes", "weather"]
"lib:app::settings_tests::a_saved_monkey_level" = ["ai", "settings", "replay"]
"lib:app::hud_tests::" = ["hud", "results"]
"lib:app::hud_tests::the_minimap_is_seen" = ["menus", "race", "setup", "hud"]
